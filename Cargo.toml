[package]
name = "arcanon_scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Git context
gix = { version = "0.81", default-features = false, features = ["blocking-network-client", "sha1"] }

# AST parsing
tree-sitter = "0.20"

# Grammar crates
tree-sitter-typescript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-go = "0.20"
tree-sitter-java = "0.20"
tree-sitter-c-sharp = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-ruby = "0.20"

# File discovery
ignore = "0.4"
globset = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
serde_yaml_bw = "2.5"

# HTTP upload
reqwest = { version = "0.11", features = ["rustls-tls", "json"] }

# Async runtime (minimal features for reqwest)
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

# CPU-bound parallelism
rayon = "1.7"

# Error handling
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
serial_test = "2"

[lib]
name = "arcanon_scanner"
path = "src/lib.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
