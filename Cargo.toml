[package]
name = "arcanon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Static service topology scanner"
license = "MIT"

[[bin]]
name = "arcanon"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Git context (minimal features — only repo discovery, remotes, HEAD ref)
gix = { version = "0.83", default-features = false, features = ["basic", "sha1"] }

# AST parsing — pin grammar crates to prevent ABI split (PITFALLS.md Pitfall 1)
tree-sitter = "0.26.8"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-ruby = "0.23.1"

# File walking
ignore = "0.4.25"
globset = "0.4.18"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
serde_yaml_bw = "2.5.6"  # replaces deprecated serde_yaml (PITFALLS.md Pitfall 2)

# HTTP upload (rustls only — no OpenSSL, musl-safe)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Async runtime (reqwest only — NOT for plugins; plugins use rayon)
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }

# CPU-bound parallelism for plugin execution
rayon = "1.12.0"

# Error handling
anyhow = "1.0.102"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Hashing (content hash fallback for git context)
sha2 = "0.11"

# URL parsing (variable resolution)
url = "2"

# Timestamps for payload metadata
chrono = { version = "0.4", features = ["serde"] }

# Cross-platform home directory resolution
dirs = "6"

# Spec parsing (Phase 3 config plugins)
openapiv3 = "2.2"
apollo-parser = "0.8"
protobuf-parse = { version = "3.7", default-features = false }

# ML Refinement (Phase 15)
# ort is split by platform: on Windows the ONNX Runtime static libs ship with /MD (dynamic CRT),
# which conflicts with /MT (static CRT) used by tokenizers/esaxx_rs. load-dynamic side-steps the
# CRT mismatch by dlopening onnxruntime.dll at runtime instead of linking statically.
# On Linux/macOS there is no CRT concept so static linking works fine.
# default-features = false drops esaxx_rs (C++ SentencePiece extension).
# CodeBERT uses BPE which is pure Rust — esaxx_rs is never needed.
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

# Linux and macOS: pre-built ONNX Runtime binaries available, link statically.
[target.'cfg(not(target_os = "windows"))'.dependencies]
ort = { version = "= 2.0.0-rc.9" }
ort-sys = { version = "= 2.0.0-rc.10" }

# Windows: load-dynamic avoids CRT mismatch (/MD vs /MT from esaxx_rs).
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "= 2.0.0-rc.9", features = ["load-dynamic"] }
ort-sys = { version = "= 2.0.0-rc.10" }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = "z"       # size-optimized (smaller than opt-level = 3)
lto = "fat"           # full LTO across all crates (most effective for binary size)
codegen-units = 1     # single codegen unit enables maximum LTO effectiveness
strip = "symbols"     # strip debug symbols explicitly (not strip = true shorthand)
