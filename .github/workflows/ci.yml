name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Check tree-sitter ABI — no duplicates allowed
        run: |
          if cargo tree --duplicates --depth 0 | grep "^tree-sitter "; then
            echo "ERROR: duplicate tree-sitter versions detected — ABI mismatch risk"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ matrix.os }}-

      - name: Test
        run: cargo test

  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/arcanon
            artifact: arcanon-linux-amd64
          - os: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/arcanon
            artifact: arcanon-macos-arm64
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/arcanon.exe
            artifact: arcanon-windows-amd64
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: build-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ matrix.os }}-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assert binary size under 250MB
        shell: bash
        run: |
          BINARY="${{ matrix.binary }}"
          SIZE=$(wc -c < "$BINARY")
          LIMIT=262144000
          echo "Binary size: $SIZE bytes (limit: $LIMIT)"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "ERROR: binary exceeds 250MB ($SIZE bytes)"
            exit 1
          fi

      - name: Package binary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          BINARY="${{ matrix.binary }}"
          ARTIFACT="${{ matrix.artifact }}"
          if [[ "$BINARY" == *.exe ]]; then
            7z a "${ARTIFACT}.zip" "$BINARY"
          else
            tar -czf "${ARTIFACT}.tar.gz" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          fi

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS=""
          for f in artifacts/**/*.tar.gz artifacts/**/*.zip; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          gh release create "$TAG" $ASSETS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
